<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NanoCloud Notes — Hybrid AI Workspace</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 16px; background: #090d16; color: #f8fafc; }
    .box { max-width: 680px; margin: 0 auto; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    h1 { font-size: 1.35rem; margin: 0; color: #38bdf8; }
    .pill { padding: 4px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; background: #1e293b; border: 1px solid #334155; }
    .local { background: #064e3b; border-color: #10b981; color: #a7f3d0; }
    .cloud { background: #1e3a8a; border-color: #3b82f6; color: #bfdbfe; }
    textarea { width: 100%; height: 150px; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #111827; color: #f8fafc; font-size: 0.95rem; }
    .btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 10px 0; }
    @media (max-width: 520px) { .btns { grid-template-columns: 1fr; } }
    button { padding: 11px; border: none; border-radius: 9px; font-weight: 700; font-size: 0.88rem; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    .b-ghost { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 6px 10px; font-size: 0.8rem; }
    .b-auto { background: #0284c7; color: #fff; }
    .b-local { background: #10b981; color: #022c22; }
    .b-cloud { background: #2563eb; color: #fff; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 14px; margin-top: 10px; }
    .out { white-space: pre-wrap; line-height: 1.55; font-size: 0.92rem; min-height: 80px; }
    .meta { margin-top: 10px; padding-top: 8px; border-top: 1px solid #1f2937; font-size: 0.76rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="box">
    <div class="row">
      <h1>NanoCloud Notes</h1>
      <div>
        <span id="net" class="pill">● Online</span>
        <span id="badge" class="pill">Ready</span>
      </div>
    </div>

    <div class="row">
      <button id="sample" class="b-ghost" onclick="fillSample()">📋 Load Sample Lecture</button>
      <span id="cnt" style="font-size:0.78rem;color:#94a3b8;">0 chars</span>
    </div>

    <textarea id="inp" oninput="updCnt()" placeholder="Paste lecture notes here..."></textarea>

    <div class="btns">
      <button id="bAuto" class="b-auto" onclick="runAI('auto')">🧠 Smart Auto-Route</button>
      <button id="bQuick" class="b-local" onclick="runAI('quick')">⚡ Quick Summary (Local)</button>
      <button id="bDeep" class="b-cloud" onclick="runAI('deep')">☁️ Study Guide & Quiz (Cloud)</button>
    </div>

    <div class="card">
      <div class="out" id="out">Tap Load Sample Lecture, then tap Smart Auto-Route or Quick Summary.</div>
      <div class="meta" id="meta">Firebase AI Logic Hybrid Inference SDK</div>
    </div>

    <div class="card">
      <div class="row" style="margin-bottom:6px;">
        <strong style="font-size:0.8rem;color:#94a3b8;">💾 OFFLINE STUDY VAULT</strong>
        <button class="b-ghost" onclick="clearVault()">Clear</button>
      </div>
      <div class="out" id="vault" style="font-size:0.85rem;color:#cbd5e1;min-height:30px;"></div>
    </div>
  </div>

  <script>
    var NL = String.fromCharCode(10);
    var SAMPLE = "Cellular Respiration & ATP Production" + NL + "Cellular respiration breaks down glucose to produce ATP, the cell's energy currency. It occurs in three stages: glycolysis in the cytoplasm (2 ATP, anaerobic), the Krebs cycle in the mitochondrial matrix, and oxidative phosphorylation along the inner mitochondrial membrane. With oxygen, aerobic respiration produces 30 to 32 ATP per glucose molecule, with oxygen acting as the final electron acceptor to form water.";

    function updCnt() {
      var n = document.getElementById("inp").value.trim().length;
      document.getElementById("cnt").textContent = n + " chars";
    }
    function fillSample() {
      document.getElementById("inp").value = SAMPLE;
      updCnt();
    }
    function drawVault() {
      var v = JSON.parse(localStorage.getItem("nc_v") || "[]");
      document.getElementById("vault").textContent = v.length ? v.join(NL + "---" + NL) : "No saved notes yet.";
    }
    function clearVault() {
      localStorage.removeItem("nc_v");
      drawVault();
    }
    drawVault();

    self.FIREBASE_APPCHECK_DEBUG_TOKEN = "2ED8D27A-02E8-4050-A774-BBF0F2D55AA2";
    var cfg = {
      apiKey: "AIzaSyAh6nklRujVWgXgaKjaHWLBPju8481E9So",
      authDomain: "://firebaseapp.com",
      projectId: "nanocloud-notes",
      storageBucket: "nanocloud-notes.firebasestorage.app",
      messagingSenderId: "1045448925013",
      appId: "1:1045448925013:web:cf7a825b4be082ce2499dc",
      measurementId: "G-YYTGF9VCSR"
    };

    var sdkBase = String.fromCharCode(104,116,116,112,115,58,47,47,119,119,119,46,103,115,116,97,116,105,99,46,99,111,109,47,102,105,114,101,98,97,115,101,106,115,47,49,51,46,52,46,48,47);
    var aiRef = null;
    var genModelFn = null;

    async function runAI(modeType) {
      var out = document.getElementById("out");
      var badge = document.getElementById("badge");
      var meta = document.getElementById("meta");
      var text = document.getElementById("inp").value.trim();

      if (!text) {
        out.textContent = "Tap Load Sample Lecture first!";
        return;
      }

      var useLocal = modeType === "quick" || (modeType === "auto" && (!navigator.onLine || text.length < 350));
      out.textContent = "Running " + (useLocal ? "On-Device / Hybrid" : "Cloud") + " AI...";

      try {
        if (!aiRef) {
          var m1 = await import(sdkBase + "firebase-app.js");
          var m2 = await import(sdkBase + "firebase-app-check.js");
          var m3 = await import(sdkBase + "firebase-ai.js");
          var app = m1.initializeApp(cfg);
          m2.initializeAppCheck(app, {
            provider: new m2.ReCaptchaEnterpriseProvider("6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"),
            isTokenAutoRefreshEnabled: true
          });
          aiRef = m3.getAI(app, { backend: new m3.GoogleAIBackend() });
          genModelFn = m3.getGenerativeModel;
        }

        var t0 = performance.now();
        var model = genModelFn(aiRef, {
          model: "gemini-2.5-flash",
          mode: useLocal ? "prefer_on_device" : "prefer_in_cloud"
        });

        var prompt = useLocal
          ? "Summarize into 3 short bullets and 3 key terms:" + NL + text
          : "Create a study guide with core concepts and 3 quiz questions with answers:" + NL + text;

        var res = await model.generateContent(prompt);
        var ans = res.response.text();
        var sec = ((performance.now() - t0) / 1000).toFixed(2);
        var src = res.response.inferenceSource || (useLocal ? "ON_DEVICE / HYBRID" : "IN_CLOUD");

        badge.textContent = String(src).indexOf("DEVICE") !== -1 ? "⚡ On-Device" : "☁️ Cloud";
        badge.className = "pill " + (String(src).indexOf("DEVICE") !== -1 ? "local" : "cloud");
        out.textContent = ans;
        meta.textContent = "Mode: " + modeType.toUpperCase() + " • Source: " + src + " • " + sec + "s";

        var v = JSON.parse(localStorage.getItem("nc_v") || "[]");
        v.unshift("[" + modeType.toUpperCase() + " • " + sec + "s]" + NL + ans);
        localStorage.setItem("nc_v", JSON.stringify(v.slice(0, 6)));
        drawVault();
      } catch (e) {
        out.textContent = "Error: " + e.message;
      }
    }
  </script>
</body>
</html>
